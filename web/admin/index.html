<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DIO-Space · 管理</title><link rel="icon" href="/assets/favicon.svg"><link rel="stylesheet" href="/admin-assets/admin.css?v=038-galaxy-admin"></head><body>
<header><a href="/admin">DIO<span> / 管理</span></a><div><a href="/" target="_blank" rel="noopener">预览首页 ↗</a><button id="logout" hidden>退出</button></div></header>
<main><p id="notice" role="status" aria-live="polite"></p><section id="login" hidden><h1>管理登录</h1><form id="login-form"><label>管理员密码<input id="password" type="password" required autocomplete="current-password"></label><button class="primary">登录</button></form></section>
<section id="workspace" hidden><nav aria-label="后台功能"><button data-view="apps">应用</button><button data-view="galaxies">星系</button><button data-view="usage">统计</button><button data-view="settings">设置</button><small>0.1.0</small></nav><div id="panel"></div></section></main>
<dialog id="editor" aria-label="编辑应用"><form id="app-form"><div class="section-head"><h2 id="editor-title">编辑应用</h2><button type="button" id="close-editor" aria-label="关闭">×</button></div><div class="fields"><label>应用 ID<input name="id" required pattern="[a-z0-9][a-z0-9_\-]{0,63}" maxlength="64"></label><label>名称<input name="name" required maxlength="80"></label><label class="wide">链接<input name="url" type="url" required maxlength="2048"></label><label>分类<select name="group"></select></label><label>图标<select name="glyph"></select></label><label>星球样式<select name="surface"></select></label><label class="wide">搜索别名<input name="aliases" maxlength="500"></label><label class="check"><input name="enabled" type="checkbox">启用</label><label class="check"><input name="test" type="checkbox">测试环境</label></div><p id="editor-error" role="alert"></p><button class="primary">保存应用</button></form></dialog>
<script src="/admin-assets/admin.js?v=038-galaxy-admin"></script></body></html>
